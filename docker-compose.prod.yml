version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  backend:
    image: ${DOCKER_USERNAME}/my-django-app:latest
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn portal_summer.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://${SERVER_IP},http://localhost
      USE_SQLITE: "False"
      DB_CONN_MAX_AGE: "60"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  frontend:
    image: ${DOCKER_USERNAME}/my-react-app:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  postgres_data:
  media_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
